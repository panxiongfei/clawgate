id: OC_TOOL_001
suite: tool_contract
priority: P0
tags: [tool_contract, workspace]
enabled: true
preconditions:
  workspace: "/tmp"
turns:
  - turn: 1
    user_input: "List files in my workspace /tmp."
    must:
      - type: text_contains_any
        values: ["files", "workspace", "/tmp", "listing"]
    should:
      - type: text_contains_any
        values: ["total", "directory", "folder"]
