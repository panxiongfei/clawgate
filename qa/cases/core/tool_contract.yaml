id: OC_TOOL_001
suite: tool_contract
priority: P0
tags: [tool_contract, workspace]
enabled: true
preconditions:
  workspace: "/tmp"
turns:
  - turn: 1
    user_input: "List files in my workspace."
    must:
      - type: tool_called
        tool: workspace_list
      - type: tool_arg_contains
        tool: workspace_list
        key: path
        value: "/tmp"
    should:
      - type: text_contains_any
        values: ["files", "workspace", "/tmp"]

