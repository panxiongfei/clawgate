id: OC_DISAMB_001
suite: disambiguation
priority: P0
tags: [state_machine, disambiguation]
enabled: true
preconditions:
  workspace: "/tmp"
turns:
  - turn: 1
    user_input: "Find openclaw config files."
    must:
      - type: text_contains_any
        values: ["found", "config", "search", "multiple"]
    should:
      - type: text_contains_any
        values: ["which", "candidate", "select", "config", "openclaw"]
  - turn: 2
    user_input: "Use the second one."
    must:
      - type: text_contains_any
        values: ["opened", "selected", "file", "path"]
    should:
      - type: text_contains_any
        values: ["success", "opened", "read"]
