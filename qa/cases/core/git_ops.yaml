id: OC_GIT_001
suite: git_ops
priority: P0
tags: [git, repo, regression]
enabled: true
preconditions:
  repository: "current"
turns:
  - turn: 1
    user_input: "Show git status for this repo."
    must:
      - type: tool_called
        tool: git_status
    should:
      - type: text_contains_any
        values: ["branch", "modified", "clean"]
  - turn: 2
    user_input: "Show what changed in the latest commit."
    must:
      - type: tool_called
        tool: git_show
    should:
      - type: text_contains_any
        values: ["commit", "files changed", "diff"]

