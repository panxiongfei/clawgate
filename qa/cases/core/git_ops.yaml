id: OC_GIT_001
suite: git_ops
priority: P0
tags: [git, repo, regression]
enabled: true
preconditions:
  repository: "current"
turns:
  - turn: 1
    user_input: "Show git status for this repo."
    must:
      - type: text_contains_any
        values: ["branch", "main", "modified", "clean", "git", "status"]
    should:
      - type: text_contains_any
        values: ["modified", "clean", "nothing to commit"]
  - turn: 2
    user_input: "Show what changed in the latest commit."
    must:
      - type: text_contains_any
        values: ["commit", "files changed", "diff", "git", "show"]
    should:
      - type: text_contains_any
        values: ["commit", "Author", "Date", "diff"]
